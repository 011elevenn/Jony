<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="jhj.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonyミームサイト - 100% DANK</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise-bg"></div>
  <div class="cursor-follow" id="cursorFollow"></div>

  <marquee class="top-marquee" scrollamount="12" direction="left">
    GANG専用 - 敵対勢力お断り - JONY公認 - 世界ワースト1位 - GANG専用 - 敵対勢力お断り - JONY公認 -
  </marquee>

  <header class="meme-header">
    <h1 class="glitch-title" data-text="JONY">JONY</h1>
    <p class="rainbow-text">世界ワースト1位 格闘家兼GANG</p>
    <img src="anime-meme-pfp-cnuq70iv0iccx8gt.jpg" alt="Jony" class="spinning-pfp">
  </header>

  <section class="meme-section">
    <h2 class="wobble-title">激レアJonyコレクション</h2>
    <div class="meme-grid">
      <div class="meme-card">
        <img src="maxresdefault.jpg" alt="meme1">
        <div class="meme-caption">1発KOの瞬間</div>
      </div>
      <div class="meme-card">
        <img src="aaaaaaaaaaaa.jpg" alt="meme2">
        <div class="meme-caption">敗北の叫び.jpg</div>
      </div>
      <div class="meme-card">
        <img src="jhj.jpg" alt="meme3">
        <div class="meme-caption">jhj.jpg (最強の証)</div>
      </div>
      <div class="meme-card">
        <img src="anime-meme-pfp-cnuq70iv0iccx8gt.jpg" alt="meme4">
        <div class="meme-caption">幹部集合写真</div>
      </div>
    </div>
  </section>

  <section class="stats-section">
    <h2 class="wobble-title">幹部戦闘データ</h2>
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-number" id="memeCount">0</span>
        <span class="stat-label">威圧レベル</span>
      </div>
      <div class="stat-box">
        <span class="stat-number">OVER 9000</span>
        <span class="stat-label">戦闘力</span>
      </div>
      <div class="stat-box">
        <span class="stat-number">4</span>
        <span class="stat-label">戦闘記録</span>
      </div>
    </div>
  </section>

  <section class="button-section">
    <button class="meme-btn" id="randomBtn">ランダムJony</button>
    <button class="meme-btn rainbow-btn" id="danceBtn">ダンスモード</button>
    <button class="meme-btn glitch-btn" id="glitchBtn">全員グリッチ</button>
    <a href="legend.html" class="meme-btn legend-link-btn">Jonyの伝説</a>
  </section>

  <section class="epilepsy-warning">
    <p>⚠️ 本サイトは極めて高いレベルのダンクさを含みます ⚠️</p>
  </section>

  <footer class="meme-footer">
    <p>JonyGANG | 敵対勢力歓迎 | コードの横取り自由</p>
  </footer>

  <audio id="danceMusic" src="Thriller (2003 Edit) 4.mp3" loop></audio>

  <div id="danceVideoContainer" class="dance-video-container">
    <video id="danceVideo" src="Ddance.mp4" loop playsinline></video>
    <button class="close-meme" id="closeDanceVideo">X</button>
  </div>

  <div id="bigMeme" class="big-meme">
    <img src="" alt="big meme" id="bigMemeImg">
    <button class="close-meme" id="closeMeme">X</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
